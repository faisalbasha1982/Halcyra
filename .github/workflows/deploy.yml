name: Verify and deploy

# Pull requests → checks + a private preview URL.
# Merge to main  → checks + database migrations + production deploy + live header check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # full history so the secret scan sees every commit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Validate HTML
        run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true   # keeps .well-known/security.txt
          retention-days: 7

  deploy:
    needs: verify
    # Never run with secrets for pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Passed through env, never interpolated into the shell: branch names are user input.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4   # deploy exactly what was verified
        with:
          name: dist
          path: dist
      - name: Apply database migrations
        if: github.event_name == 'push'
        run: npx wrangler d1 migrations apply halcyra-leads --remote
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=halcyra-site --branch="$BRANCH" --commit-hash="$GITHUB_SHA"
      - name: Check live security headers
        if: github.event_name == 'push' && vars.SITE_URL != ''
        run: node scripts/check-live.mjs "${{ vars.SITE_URL }}"
